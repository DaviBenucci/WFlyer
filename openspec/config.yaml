schema: spec-driven

context: |
  This repository is exclusively for the wflyer.com.br institutional website.
  Locked stack: Next.js App Router, React, strict TypeScript, Tailwind CSS 4,
  GSAP/ScrollTrigger/@gsap/react, local content, and original SVG.
  Normative documentation, ADRs, manifests, and approved golden references take
  precedence over OpenSpec artifacts. app.wflyer.com.br and the musical
  application remain out of scope. Do not invent metrics, people, clients, or
  results. Gates include lint, typecheck, Vitest, Storybook, Playwright, axe,
  standalone build, and Lighthouse as required by each phase. Deployment
  requires approval and external access.

rules:
  proposal:
    - Declare scope, non-goals, affected normative documents, and rollback.
    - Separate verified facts, inferences, and pending work.
  specs:
    - Write observable requirements with Given/When/Then scenarios.
    - Include accessibility, reduced motion, failures, and fallback when applicable.
  design:
    - Trace decisions to ADRs, manifests, or approved golden references.
    - Record risks, test strategy, and rollback path.
  tasks:
    - Mark a task complete only with verifiable implementation and evidence.
    - Do not archive a change before strict validation and risk-proportionate gates.
