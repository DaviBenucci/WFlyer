    gates: [MUSIC-A, MUSIC-B-HUMAN, MUSIC-C-HUMAN]
  - id: P2
    name: Story v2 model and static vertical skeleton
    status: gate-2-complete
    gate: G2
  - id: P3
    name: Content and detailed routes
    status: gate-3-complete
    gate: G3
  - id: P4
    name: Intro/bootstrap/deep links
    status: gate-4-complete
    gate: G4
  - id: P5
    name: Desktop Motion Lab and master story
    status: gate-5-complete
    gate: G5
  - id: P6
    name: Header traversal and history
    status: gate-6-complete
    gate: G6
  - id: P7
    name: Professional scenes
    status: gate-7-complete
    gate: G7
  - id: P8
    name: Application scenes
    status: next-permitted-not-started
    gate: G8
  - id: P9
    name: Continuous dual-score integration
    gates: [G9-SCORE-PATH-HUMAN, G9]
  - id: P10
    name: Persona final asset and easter eggs
    gate: G10-HUMAN
  - id: P11
    name: Final APP-04 media
    gate: G11-HUMAN
  - id: P12
    name: Accessibility/responsive/reduced-motion hardening
    gate: G12
  - id: P13
    name: Performance/lifecycle/recovery
    gate: G13
  - id: P14
    name: Cutover/legacy removal/full regression
    gate: G14
  - id: P15
    name: Staging/homologation/production authorization
