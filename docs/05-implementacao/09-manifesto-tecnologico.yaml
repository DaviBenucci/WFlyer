project: wflyer-site
status: normative
updated_at: 2026-08-29
architecture:
  classification: static-first
  pure_static_export: false
  database: prohibited-v1
  cms: prohibited-v1
  runtime_ai: prohibited-v1
  page_model: route-based-score-chapters
  visual_reference_gate: archetype-authorized
runtime:
  node: "24 LTS"
  package_manager: pnpm
  package_manager_version: "11.24.0"
  corepack: required
  output: standalone
  entry_point: .next/standalone/server.js
  start_command: node .next/standalone/server.js
framework:
  next: {line: "16.3", minimum_security_patch: "16.3.3", output: standalone}
  react: {line: "19.2"}
  typescript: {strict: true}
styling:
  tailwind: "4"
  css_custom_properties: true
  css_3d: allowed-for-tablet-shell
motion:
  gsap: "3"
  allowed_plugins: [ScrollTrigger]
  react_adapter: "@gsap/react"
  native_scroll: true
  route_transitions: gsap-only
  reduced_motion: required
  prohibited: [animejs, motion, framer-motion, react-spring, lenis, threejs, react-three-fiber, webgl, lottie]
content:
  mdx_local: true
  typed_objects: true
  fabricated_metrics: prohibited
  profile: docs/04-conteudo/08-perfil-publicacao.yaml
visual_references:
  runtime_import: prohibited
  production_shipping: prohibited
  allowed_statuses: [approved-individual, approved-master-panel, authorized-derived]
  archetype_manifest: docs/design-reference/golden-pages/visual-archetypes.yaml
application_demo:
  dom_screen: required
  local_deterministic_data: required
  network_calls: prohibited
  uploads: prohibited
  real_music_processing: prohibited
contact:
  endpoint: /api/contact
  validation: zod
  email: resend
  captcha: cloudflare-turnstile
  rate_limit: conditional-napoleon-capability-not-yet-evidenced
  persistence: none
  public_email: davi.benucci@wflyer.com.br
  recipient_email: davi.benucci@wflyer.com.br
analytics:
  enabled: false
  marketing_cookies: false
  session_replay: false
testing:
  unit: vitest
  component: storybook
  e2e: playwright
  accessibility: axe-core
  performance: lighthouse-ci
  visual_regression: required
deployment:
  mode: napoleon-managed-node-github
  provider: napoleon
  repository_provider: github
  repository_owner: DaviBenucci
  source_handoff: napoleon-git-pull-and-build
  actions_role: candidate-validation-and-provenance
  actions_archive_deployed_to_napoleon: false
  static_document_root: prohibited
  docker_required: false
  vps_required: false
  easypanel: prohibited
  registrar: registro-br
  authoritative_dns: napoleon
  hosting: napoleon
  cloudflare_dns_proxy: inactive
  cloudflare_turnstile: independent-active-integration
  github_environment_values:
    store: github-environment-secrets
    transfer_to_napoleon: false
    configuration_state: external-pending
  napoleon_build_and_runtime_values:
    store: napoleon-application-configuration
    configured_independently: required
    configuration_state: external-pending
  production_hostname: wflyer.com.br
  staging_hostname: owner-approved-value-pending
  staging_hostname_owner: Davi Benucci
  existing_application_hostname: app.wflyer.com.br
  existing_application_mutation: prohibited
  nameserver_change: explicit-owner-approval-required
  destructive_dns_change: prohibited
  ssl_target: napoleon-https-after-validation
  immutable_release_by_commit: required
  rollback_test: required
homologation:
  responsible: Davi Benucci
implementation_readiness:
  current: CODE_COMPLETE_EXTERNAL_CONFIGURATION_PENDING
  repository_final_gates: complete
  external_configuration: pending
  production_state: NOT_AUTHORIZED
  contract: docs/05-implementacao/14-contrato-execucao-integral-codex.md
  checklist: docs/05-implementacao/15-checklist-prontidao-pre-codigo.md
