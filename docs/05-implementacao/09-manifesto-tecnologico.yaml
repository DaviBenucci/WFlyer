project: wflyer-site
status: normative
updated_at: 2026-07-27
architecture:
  classification: static-first
  pure_static_export: false
  database: prohibited-v1
  cms: prohibited-v1
  runtime_ai: prohibited-v1
runtime:
  node: "24 LTS"
  package_manager: pnpm
framework:
  next:
    line: "16.2"
    minimum_security_patch: "16.2.11"
  react:
    line: "19.2"
  typescript:
    strict: true
styling:
  tailwind: "4"
  css_custom_properties: true
motion:
  gsap: "3"
  allowed_plugins:
    - ScrollTrigger
  react_adapter: "@gsap/react"
  native_scroll: true
  prohibited:
    - animejs
    - motion
    - framer-motion
    - react-spring
    - lenis
    - threejs
    - react-three-fiber
    - lottie
content:
  mdx_local: true
  typed_objects: true
contact:
  endpoint: /api/contact
  validation: zod
  email: resend
  captcha: cloudflare-turnstile
  rate_limit: cloudflare-waf
  persistence: none
testing:
  unit: vitest
  component: storybook
  e2e: playwright
  accessibility: axe-core
  performance: lighthouse-ci
deployment:
  mode: next-standalone-docker
  edge: cloudflare
