<svg xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  id="wf-intro-master"
  viewBox="0 0 1200 675"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="wf-accessibility-title wf-accessibility-description"
  focusable="false"
  data-asset-name="wflyer-intro-master"
  data-asset-version="1.0.0-review"
  data-state="initial"
  color="#ffffff"
  style="
    --wf-intro-logo-color:#ffffff;
    --wf-intro-origin-start:#844dff;
    --wf-intro-origin-end:#2857ff;
    --wf-intro-echo-1:#844dff;
    --wf-intro-echo-2:#22d3ee;
    --wf-intro-sweep-start:#844dff;
    --wf-intro-sweep-mid:#2857ff;
    --wf-intro-sweep-end:#22d3ee;
  ">
  <title id="wf-accessibility-title">W_Flyer</title>
  <desc id="wf-accessibility-description">Asset vetorial oficial preparado para a animação de entrada da marca W_Flyer.</desc>

  <defs>
    <g id="wf-official-geometry" fill-rule="evenodd">
      <path id="wf-geometry-symbol-anchor" d="M 3.00 2.00 L 43.00 158.00 L 70.00 158.00 L 101.00 117.00 L 106.00 112.00 L 119.00 112.00 L 120.00 113.00 L 86.00 158.00 L 145.00 158.00 L 182.00 105.00 L 87.00 105.00 L 85.00 101.00 L 85.00 97.00 L 79.00 76.00 L 78.00 68.00 L 76.00 64.00 L 76.00 60.00 L 65.00 19.00 L 62.00 3.00 L 61.00 2.00 Z"/>
      <path id="wf-geometry-symbol-upper-wing" d="M 95.00 94.00 L 97.00 93.00 L 116.00 93.00 L 117.00 94.00 L 119.00 93.00 L 150.00 53.00 L 159.00 43.00 L 254.00 43.00 L 276.00 2.00 L 129.00 2.00 L 86.00 57.00 Z"/>
      <path id="wf-geometry-symbol-lower-wing" d="M 134.00 93.00 L 226.00 93.00 L 248.00 55.00 L 164.00 55.00 Z"/>
      <path id="wf-geometry-wordmark-w" d="M 318.00 129.00 L 319.00 130.00 L 346.00 130.00 L 360.00 102.00 L 360.00 100.00 L 367.00 87.00 L 367.00 85.00 L 370.00 81.00 L 373.00 92.00 L 373.00 98.00 L 374.00 99.00 L 375.00 111.00 L 377.00 117.00 L 378.00 130.00 L 405.00 130.00 L 451.00 37.00 L 424.00 37.00 L 423.00 38.00 L 422.00 42.00 L 408.00 69.00 L 401.00 87.00 L 397.00 93.00 L 396.00 92.00 L 396.00 86.00 L 394.00 79.00 L 394.00 73.00 L 393.00 72.00 L 388.00 37.00 L 366.00 37.00 L 365.00 38.00 L 365.00 40.00 L 357.00 55.00 L 357.00 57.00 L 350.00 70.00 L 350.00 72.00 L 340.00 93.00 L 338.00 91.00 L 338.00 85.00 L 337.00 84.00 L 337.00 78.00 L 336.00 77.00 L 331.00 37.00 L 303.00 37.00 L 308.00 70.00 L 309.00 71.00 L 309.00 76.00 L 310.00 77.00 L 310.00 82.00 L 311.00 83.00 L 311.00 88.00 L 312.00 89.00 L 312.00 94.00 L 315.00 106.00 L 315.00 112.00 L 318.00 124.00 Z"/>
      <path id="wf-geometry-wordmark-underscore" d="M 417.00 130.00 L 470.00 130.00 L 475.00 112.00 L 426.00 112.00 Z"/>
      <path id="wf-geometry-wordmark-f" d="M 581.00 37.00 L 518.00 37.00 L 508.00 41.00 L 501.00 49.00 L 498.00 57.00 L 498.00 61.00 L 490.00 92.00 L 490.00 96.00 L 481.00 130.00 L 505.00 130.00 L 508.00 114.00 L 512.00 101.00 L 512.00 97.00 L 515.00 90.00 L 566.00 90.00 L 567.00 91.00 L 571.00 75.00 L 519.00 75.00 L 518.00 72.00 L 519.00 71.00 L 520.00 63.00 L 522.00 57.00 L 526.00 54.00 L 578.00 54.00 Z"/>
      <path id="wf-geometry-wordmark-l" d="M 615.00 37.00 L 592.00 37.00 L 570.00 130.00 L 593.00 130.00 L 596.00 114.00 L 600.00 101.00 L 600.00 97.00 L 603.00 88.00 L 603.00 84.00 L 607.00 71.00 L 607.00 67.00 Z"/>
      <path id="wf-geometry-wordmark-y" d="M 691.00 71.00 L 668.00 71.00 L 645.00 109.00 L 643.00 107.00 L 643.00 100.00 L 642.00 99.00 L 638.00 71.00 L 616.00 71.00 L 619.00 84.00 L 619.00 90.00 L 620.00 91.00 L 623.00 114.00 L 625.00 120.00 L 626.00 133.00 L 609.00 159.00 L 610.00 158.00 L 635.00 158.00 L 637.00 156.00 Z"/>
      <path id="wf-geometry-wordmark-e" d="M 697.00 79.00 L 692.00 89.00 L 691.00 97.00 L 686.00 116.00 L 686.00 122.00 L 687.00 125.00 L 690.00 128.00 L 696.00 130.00 L 755.00 130.00 L 755.00 126.00 L 758.00 117.00 L 757.00 116.00 L 756.00 117.00 L 712.00 117.00 L 709.00 115.00 L 709.00 108.00 L 710.00 107.00 L 748.00 107.00 L 756.00 104.00 L 761.00 99.00 L 764.00 91.00 L 765.00 79.00 L 762.00 74.00 L 755.00 71.00 L 710.00 71.00 L 701.00 75.00 Z M 713.00 94.00 L 715.00 88.00 L 718.00 85.00 L 740.00 85.00 L 742.00 87.00 L 742.00 91.00 L 738.00 95.00 L 714.00 95.00 Z"/>
      <path id="wf-geometry-wordmark-r" d="M 842.00 70.00 L 795.00 70.00 L 783.00 73.00 L 779.00 77.00 L 776.00 85.00 L 766.00 130.00 L 789.00 130.00 L 789.00 126.00 L 795.00 104.00 L 798.00 87.00 L 800.00 85.00 L 836.00 85.00 Z"/>
    </g>

    <clipPath id="wf-wordmark-clip" clipPathUnits="userSpaceOnUse">
      <rect id="wf-wordmark-clip-rect" x="294" y="0" width="0" height="162"/>
    </clipPath>

    <linearGradient id="wf-origin-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#844dff" style="stop-color:var(--wf-intro-origin-start,#844dff)"/>
      <stop offset="1" stop-color="#2857ff" style="stop-color:var(--wf-intro-origin-end,#2857ff)"/>
    </linearGradient>

    <linearGradient id="wf-ink-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#844dff" stop-opacity="0" style="stop-color:var(--wf-intro-sweep-start,#844dff);stop-opacity:0"/>
      <stop offset="0.30" stop-color="#844dff" stop-opacity="0.65" style="stop-color:var(--wf-intro-sweep-start,#844dff);stop-opacity:0.65"/>
      <stop offset="0.55" stop-color="#2857ff" stop-opacity="0.95" style="stop-color:var(--wf-intro-sweep-mid,#2857ff);stop-opacity:0.95"/>
      <stop offset="0.78" stop-color="#22d3ee" stop-opacity="0.55" style="stop-color:var(--wf-intro-sweep-end,#22d3ee);stop-opacity:0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" style="stop-color:var(--wf-intro-sweep-end,#22d3ee);stop-opacity:0"/>
    </linearGradient>

    <filter id="wf-origin-glow-filter" x="-100%" y="-600%" width="300%" height="1300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="wf-ink-soften-filter" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <style>
    #wf-intro-master,
    #wf-intro-master * {
      vector-effect: non-scaling-stroke;
    }

    #wf-logo,
    #wf-symbol,
    #wf-symbol-anchor,
    #wf-symbol-upper-wing,
    #wf-symbol-lower-wing,
    #wf-echo-1,
    #wf-echo-2,
    #wf-wordmark,
    #wf-origin-underscore,
    #wf-origin-underscore-glow,
    #wf-ink-sweep {
      transform-box: fill-box;
      transform-origin: center;
    }

    #wf-intro-master[data-state="initial"] #wf-origin-layer { opacity:1; }
    #wf-intro-master[data-state="initial"] #wf-symbol,
    #wf-intro-master[data-state="initial"] #wf-wordmark-reveal,
    #wf-intro-master[data-state="initial"] #wf-echo-1,
    #wf-intro-master[data-state="initial"] #wf-echo-2,
    #wf-intro-master[data-state="initial"] #wf-ink-sweep { opacity:0; }

    #wf-intro-master[data-state="symbol"] #wf-origin-layer,
    #wf-intro-master[data-state="symbol"] #wf-wordmark-reveal,
    #wf-intro-master[data-state="symbol"] #wf-echo-1,
    #wf-intro-master[data-state="symbol"] #wf-echo-2,
    #wf-intro-master[data-state="symbol"] #wf-ink-sweep { opacity:0; }
    #wf-intro-master[data-state="symbol"] #wf-symbol { opacity:1; }

    #wf-intro-master[data-state="final"] #wf-origin-layer,
    #wf-intro-master[data-state="final"] #wf-echo-1,
    #wf-intro-master[data-state="final"] #wf-echo-2,
    #wf-intro-master[data-state="final"] #wf-ink-sweep { opacity:0; }
    #wf-intro-master[data-state="final"] #wf-symbol,
    #wf-intro-master[data-state="final"] #wf-wordmark-reveal { opacity:1; }
    #wf-intro-master[data-state="final"] #wf-wordmark-reveal { clip-path:none; }
  </style>

  <rect width="1200" height="675" fill="#080b1c"/>
  <g id="wf-intro-stage" pointer-events="none">
    <g id="wf-origin-layer" opacity="1">
      <path id="wf-origin-underscore-glow"
        d="M 552 337.5 H 648"
        fill="none"
        stroke="url(#wf-origin-gradient)"
        stroke-width="12"
        stroke-linecap="round"
        opacity="0.42"
        filter="url(#wf-origin-glow-filter)"/>
      <path id="wf-origin-underscore"
        d="M 552 337.5 H 648"
        pathLength="1"
        fill="none"
        stroke="url(#wf-origin-gradient)"
        stroke-width="6"
        stroke-linecap="round"/>
    </g>

    <!-- Static wrapper establishes the approved final lockup position. Do not animate this wrapper. -->
    <g id="wf-intro-lockup-position" transform="translate(177.5 256.5)">
      <!-- Animate wf-intro-logo / wf-logo, not wf-intro-lockup-position. -->
      <g id="wf-intro-logo">
        <g id="wf-logo" fill="currentColor" fill-rule="evenodd">
          <g id="wf-symbol-echoes" aria-hidden="true">
            <g id="wf-echo-2"
              fill="none"
              stroke="#22d3ee" style="stroke:var(--wf-intro-echo-2,#22d3ee)"
              stroke-width="0.9"
              stroke-linejoin="round"
              stroke-linecap="round"
              opacity="0">
              <use href="#wf-geometry-symbol-anchor" xlink:href="#wf-geometry-symbol-anchor"/>
              <use href="#wf-geometry-symbol-upper-wing" xlink:href="#wf-geometry-symbol-upper-wing"/>
              <use href="#wf-geometry-symbol-lower-wing" xlink:href="#wf-geometry-symbol-lower-wing"/>
            </g>
            <g id="wf-echo-1"
              fill="none"
              stroke="#844dff" style="stroke:var(--wf-intro-echo-1,#844dff)"
              stroke-width="1.25"
              stroke-linejoin="round"
              stroke-linecap="round"
              opacity="0">
              <use href="#wf-geometry-symbol-anchor" xlink:href="#wf-geometry-symbol-anchor"/>
              <use href="#wf-geometry-symbol-upper-wing" xlink:href="#wf-geometry-symbol-upper-wing"/>
              <use href="#wf-geometry-symbol-lower-wing" xlink:href="#wf-geometry-symbol-lower-wing"/>
            </g>
          </g>

          <g id="wf-symbol" opacity="0">
            <g id="wf-symbol-anchor">
              <use href="#wf-geometry-symbol-anchor" xlink:href="#wf-geometry-symbol-anchor"/>
            </g>
            <g id="wf-symbol-upper-wing">
              <use href="#wf-geometry-symbol-upper-wing" xlink:href="#wf-geometry-symbol-upper-wing"/>
            </g>
            <g id="wf-symbol-lower-wing">
              <use href="#wf-geometry-symbol-lower-wing" xlink:href="#wf-geometry-symbol-lower-wing"/>
            </g>
          </g>

          <g id="wf-wordmark-reveal" clip-path="url(#wf-wordmark-clip)" opacity="0">
            <g id="wf-wordmark">
              <use id="wf-wordmark-w" href="#wf-geometry-wordmark-w" xlink:href="#wf-geometry-wordmark-w"/>
              <use id="wf-wordmark-underscore" href="#wf-geometry-wordmark-underscore" xlink:href="#wf-geometry-wordmark-underscore"/>
              <use id="wf-wordmark-f" href="#wf-geometry-wordmark-f" xlink:href="#wf-geometry-wordmark-f"/>
              <use id="wf-wordmark-l" href="#wf-geometry-wordmark-l" xlink:href="#wf-geometry-wordmark-l"/>
              <use id="wf-wordmark-y" href="#wf-geometry-wordmark-y" xlink:href="#wf-geometry-wordmark-y"/>
              <use id="wf-wordmark-e" href="#wf-geometry-wordmark-e" xlink:href="#wf-geometry-wordmark-e"/>
              <use id="wf-wordmark-r" href="#wf-geometry-wordmark-r" xlink:href="#wf-geometry-wordmark-r"/>
            </g>
          </g>

          <rect id="wf-ink-sweep"
            x="286"
            y="20"
            width="112"
            height="128"
            rx="10"
            fill="url(#wf-ink-gradient)"
            opacity="0"
            filter="url(#wf-ink-soften-filter)"
            aria-hidden="true"/>
        </g>
      </g>
    </g>
  </g>
</svg>
