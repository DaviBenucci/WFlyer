name: CI

on:
  push:
    branches:
      - main
      - develop/site-institucional
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop/site-institucional
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  WFLYER_BUILD_ID: ${{ github.sha }}
  WFLYER_DEPLOYMENT_ENVIRONMENT: production

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate dependency policy
        run: pnpm validate:dependencies

      - name: Validate OpenSpec
        run: pnpm dlx @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Validate peer dependencies
        run: pnpm peers check

  storybook:
    name: Storybook build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Storybook browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Test Storybook stories
        run: pnpm test:storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser, accessibility and visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/e2e
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/e2e
        run: pnpm test:e2e

      - name: Run accessibility tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/a11y
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/a11y
        run: pnpm test:a11y

      - name: Run visual regression tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/visual
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/visual
        run: pnpm test:visual

      - name: Run motion tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/motion
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/motion
        run: pnpm test:motion

      - name: Upload browser test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  standalone:
    name: Standalone build, smoke and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Complete standalone package
        run: pnpm prepare:standalone

      - name: Smoke standalone server and production indexing
        run: |
          pnpm smoke:standalone
          pnpm smoke:indexing

      - name: Install Lighthouse browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse budgets
        run: pnpm lighthouse

      - name: Validate fail-closed staging build
        env:
          WFLYER_DEPLOYMENT_ENVIRONMENT: staging
        run: |
          pnpm build
          pnpm prepare:standalone
          pnpm smoke:indexing

      - name: Validate fail-closed build without an environment selector
        run: |
          env -u WFLYER_DEPLOYMENT_ENVIRONMENT pnpm build
          pnpm prepare:standalone
          env -u WFLYER_DEPLOYMENT_ENVIRONMENT pnpm smoke:indexing

      - name: Validate fail-closed build with an invalid environment selector
        env:
          WFLYER_DEPLOYMENT_ENVIRONMENT: preview
        run: |
          pnpm build
          pnpm prepare:standalone
          pnpm smoke:indexing

      - name: Upload Lighthouse evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
