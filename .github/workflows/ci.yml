name: CI

on:
  push:
    branches:
      - main
      - develop/site-institucional
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop/site-institucional
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  WFLYER_BUILD_ID: ${{ github.sha }}
  WFLYER_DEPLOYMENT_ENVIRONMENT: production

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate dependency policy
        run: pnpm validate:dependencies

      - name: Validate OpenSpec
        run: pnpm dlx @fission-ai/openspec@1.11.0 validate --all --strict --no-interactive

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Validate peer dependencies
        run: pnpm peers check

  storybook:
    name: Storybook build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Storybook browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Test Storybook stories
        run: pnpm test:storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser, accessibility and visual tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      WFLYER_PLAYWRIGHT_TEST_SERVER: production
      WFLYER_TRANSITION_TEST_MODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify writable browser workspace
        run: |
          set -euo pipefail
          pnpm_store="$(pnpm store path --silent)"
          mkdir -p \
            "${pnpm_store}" \
            "${GITHUB_WORKSPACE}/.next" \
            "${GITHUB_WORKSPACE}/test-results" \
            "${GITHUB_WORKSPACE}/playwright-report"
          test "$(id -u)" -eq 0
          test -w "${HOME}"
          test -w "${GITHUB_WORKSPACE}"
          test -w "${pnpm_store}"
          test -w "${GITHUB_WORKSPACE}/.next"
          test -w "${GITHUB_WORKSPACE}/test-results"
          test -w "${GITHUB_WORKSPACE}/playwright-report"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical browser environment
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          playwright_version="$(pnpm exec playwright --version)"
          browser_path="${PLAYWRIGHT_BROWSERS_PATH:?PLAYWRIGHT_BROWSERS_PATH is required}"
          printf 'Node.js %s\n' "${node_version}"
          printf 'pnpm %s\n' "${pnpm_version}"
          printf 'Playwright %s\n' "${playwright_version}"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "${browser_path}"
          test "${ID}" = "ubuntu"
          test "${VERSION_ID}" = "24.04"
          test "${node_version%%.*}" = "v24"
          test "${pnpm_version}" = "11.24.0"
          test "${playwright_version}" = "Version 1.62.1"
          test "${browser_path}" = "/ms-playwright"
          test -d "${browser_path}"
          test -r "${browser_path}"
          browser_plan="$(pnpm exec playwright install --dry-run)"
          printf '%s\n' "${browser_plan}"
          for expected_browser in \
            "(playwright chromium v1234)" \
            "(playwright chromium-headless-shell v1234)" \
            "(playwright firefox v1538)" \
            "(playwright webkit v2336)" \
            "(playwright ffmpeg v1011)"
          do
            grep -Fq "${expected_browser}" <<<"${browser_plan}"
          done
          mapfile -t browser_locations < <(
            sed -n 's/^[[:space:]]*Install location:[[:space:]]*//p' \
              <<<"${browser_plan}"
          )
          test "${#browser_locations[@]}" -eq 5
          for install_location in "${browser_locations[@]}"; do
            case "${install_location}" in
              "${browser_path}"/*) ;;
              *) exit 1 ;;
            esac
            test -d "${install_location}"
            test -r "${install_location}/INSTALLATION_COMPLETE"
          done

      - name: Build and prepare browser-test application
        run: |
          pnpm build
          pnpm prepare:standalone

      - name: Run end-to-end tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/e2e
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/e2e
        run: pnpm test:e2e

      - name: Run accessibility tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/a11y
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/a11y
        run: pnpm test:a11y

      - name: Run motion tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/motion
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/motion
        run: pnpm test:motion

      - name: Run visual regression tests
        env:
          WFLYER_PLAYWRIGHT_OUTPUT_DIR: test-results/visual
          WFLYER_PLAYWRIGHT_REPORT_DIR: playwright-report/visual
        run: pnpm test:visual

      - name: Upload browser test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  standalone:
    name: Standalone build, smoke and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Complete standalone package
        run: pnpm prepare:standalone

      - name: Smoke standalone server and production indexing
        run: |
          pnpm smoke:standalone
          pnpm smoke:indexing

      - name: Install Lighthouse browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse budgets
        run: pnpm lighthouse

      - name: Validate fail-closed staging build
        env:
          WFLYER_DEPLOYMENT_ENVIRONMENT: staging
        run: |
          pnpm build
          pnpm prepare:standalone
          pnpm smoke:indexing

      - name: Validate fail-closed build without an environment selector
        run: |
          env -u WFLYER_DEPLOYMENT_ENVIRONMENT pnpm build
          pnpm prepare:standalone
          env -u WFLYER_DEPLOYMENT_ENVIRONMENT pnpm smoke:indexing

      - name: Validate fail-closed build with an invalid environment selector
        env:
          WFLYER_DEPLOYMENT_ENVIRONMENT: preview
        run: |
          pnpm build
          pnpm prepare:standalone
          pnpm smoke:indexing

      - name: Upload Lighthouse evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
